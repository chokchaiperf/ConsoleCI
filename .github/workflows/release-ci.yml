name: "Release CI (tags: rel / stg / sand)"

# Workflow อิสระสำหรับ "release" — trigger เฉพาะตอน push tag ที่ตรงกับ slot
# ที่กำหนดไว้เท่านั้น: rel (Release) / stg (Staging) / sand (Sandbox)
# รูปแบบ tag: <slot>-vMAJOR.MINOR.BUILD-YYMMDD (คั่นด้วย "-" ก่อนวันที่)
# เช่น rel-v1.1.2562-260525 — ตรงกับ TAG_REGEX ใน notify-telegram.sh
#
# เหตุผลที่แยกเป็นไฟล์ของตัวเอง (แทนที่จะรวมกับ branch push ในไฟล์เดียว):
# - ใน GitHub Actions แต่ละ workflow file ถูกประเมิน trigger แยกจากกันโดยอิสระ
#   ทำให้ tag push ที่ตามหลัง branch push ติดๆ ไม่มีทางถูก trigger ผิดเงื่อนไข
#   หรือถูกบดบังโดย logic ของอีก trigger หนึ่งอีกต่อไป (ปัญหาที่เคยเจอ)
# - การระบุ pattern ตรง ๆ ทีละ slot (แทน wildcard `[a-zA-Z]*-v...`) ทำให้ workflow นี้
#   trigger เฉพาะ tag ที่ตั้งใจ deploy จริง ๆ เท่านั้น — tag อื่น ๆ (เช่น dev*, prod
#   หรือ tag ทดลองที่สะกดผิด) จะไม่ทำให้ release pipeline รันโดยไม่ตั้งใจ
on:
  push:
    tags:
      - 'rel-v[0-9]*.[0-9]*.[0-9]*-[0-9][0-9][0-9][0-9][0-9][0-9]'
      - 'stg-v[0-9]*.[0-9]*.[0-9]*-[0-9][0-9][0-9][0-9][0-9][0-9]'
      - 'sand-v[0-9]*.[0-9]*.[0-9]*-[0-9][0-9][0-9][0-9][0-9][0-9]'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint shell scripts
        run: shellcheck scripts/notify-telegram.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        # หมายเหตุ: ต้องประกาศ `set -eo pipefail` เอง — ห้ามพึ่ง default shell behavior
        # เพราะ runner ของ GitHub Actions ไม่ได้เปิด pipefail ให้จริงเสมอไป (ต่างจาก CircleCI
        # ที่เปิด `set -eo pipefail` เป็นค่า default ของ `run` step) ทำให้ exit code ของ
        # `dotnet build` ที่ fail ถูก `tee` กลบจนเหลือ exit 0 และ step ขึ้นเขียวทั้งที่ build พัง
        run: |
          set -eo pipefail
          dotnet build --no-restore --configuration Release -p:MockObfuscate=true -p:ForceFail=false 2>&1 | tee build.log

      - name: Run tests
        run: |
          dotnet test --no-build --configuration Release \
            --logger "junit;LogFilePath=test-results/results.xml"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/

      - name: Notify Telegram
        if: always()
        run: bash scripts/notify-telegram.sh
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Release pipeline -> ส่งเข้ากลุ่ม "Thes Pipeline Alert Prod" โดยเฉพาะ
          # ดึงจาก secret TELEGRAM_CHAT_ID_RELEASE (ผู้ใช้สร้างไว้แล้วทั้งสอง CI)
          # แทนการ hardcode — แยกช่องจาก dev-ci.yml ตั้งใจ เพื่อไม่ให้ noise ของ dev
          # build ไปปนกับ noti ที่สำคัญของ release/deploy ที่ทีมต้องจับตาใกล้ชิดกว่า
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_RELEASE }}
          BUILD_STATUS: ${{ job.status }}
          FIREBASE_URL: "https://appdistribution.firebase.google.com/mock"
          FIREBASE_SETUP_URLS: "iOS=https://mock.example.com/setup-ios|Android=https://mock.example.com/setup-android|Web=https://mock.example.com/setup-web"
          PLAY_STORE_URL: "https://play.google.com/store/apps/details?id=com.example.mock"
          TESTFLIGHT_URL: "https://testflight.apple.com/join/mocktoken"
          SETUP_URL: "https://mock.example.com/setup"
