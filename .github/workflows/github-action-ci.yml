name: .NET Console App CI

on:
  push:
    branches: ['**']
    tags:
      - '[a-zA-Z]*-v[0-9]*.[0-9]*.[0-9]*-[0-9][0-9][0-9][0-9][0-9][0-9]'
  pull_request:

jobs:
  build_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint shell scripts
        run: shellcheck scripts/notify-telegram.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:MockObfuscate=true 2>&1 | tee build.log

      - name: Run tests
        run: |
          dotnet test --no-build --configuration Release \
            --logger "junit;LogFilePath=test-results/results.xml"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/

      - name: Notify Telegram
        if: always()
        run: bash scripts/notify-telegram.sh
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BUILD_STATUS: ${{ job.status }}
          FIREBASE_URL: "https://appdistribution.firebase.google.com/mock"
          FIREBASE_SETUP_URLS: "iOS=https://mock.example.com/setup-ios|Android=https://mock.example.com/setup-android|Web=https://mock.example.com/setup-web"
          PLAY_STORE_URL: "https://play.google.com/store/apps/details?id=com.example.mock"
          TESTFLIGHT_URL: "https://testflight.apple.com/join/mocktoken"
          SETUP_URL: "https://mock.example.com/setup"