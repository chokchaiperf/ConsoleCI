version: 2.1

parameters:
  GIT_TAG:
    type: string
    default: ""

jobs:
  build_test:
    parameters:
      telegram_chat_id_var:
        type: string
        default: "TELEGRAM_CHAT_ID_DEV"
      firebase_url:
        type: string
        default: ""
      firebase_setup_android_url:
        type: string
        default: ""
      firebase_setup_ios_url:
        type: string
        default: ""

    docker:
      - image: mcr.microsoft.com/dotnet/sdk:10.0

    steps:
      - checkout

      - run:
          name: Install tools (jq, shellcheck)
          command: apt-get update -qq && apt-get install -y -qq jq shellcheck

      - run:
          name: Lint shell scripts
          command: |
            shellcheck scripts/notify-telegram.sh 2>&1 | tee shellcheck.log || { echo "Lint shell scripts" > ci-failed-step.txt; exit 1; }

      - run:
          name: Generate NuGet cache key
          command: |
            find . -name "*.csproj" -not -path "*/obj/*" -not -path "*/bin/*" \
              | sort | xargs cat > /tmp/nuget-cache-key.txt

      - restore_cache:
          keys:
            - nuget-{{ checksum "/tmp/nuget-cache-key.txt" }}
            - nuget-

      - run:
          name: Restore dependencies
          command: dotnet restore

      - run:
          name: Build
          command: |
            set -eo pipefail
            dotnet build --no-restore --configuration Release -p:MockObfuscate=true -p:ForceFail=false 2>&1 | tee build.log || { echo "Build" > ci-failed-step.txt; exit 1; }

      - run:
          name: Run tests
          command: dotnet test --no-build --configuration Release --logger "junit;LogFilePath=test-results/results.xml" || { echo "Run tests" > ci-failed-step.txt; exit 1; }

      - save_cache:
          paths:
            - ~/.nuget/packages
          key: nuget-{{ checksum "/tmp/nuget-cache-key.txt" }}

      - store_test_results:
          path: test-results

      - run:
          name: Notify Telegram (success)
          when: on_success
          command: |
            CHAT_ID_VAR_NAME="<< parameters.telegram_chat_id_var >>"
            BUILD_STATUS=success \
            PLATFORM=Android \
            TELEGRAM_CHAT_ID="${!CHAT_ID_VAR_NAME}" \
            FIREBASE_URL="<< parameters.firebase_url >>" \
            FIREBASE_SETUP_ANDROID_URL="<< parameters.firebase_setup_android_url >>" \
            FIREBASE_SETUP_IOS_URL="<< parameters.firebase_setup_ios_url >>" \
            PLAY_STORE_URL="https://play.google.com/store/apps/details?id=com.example.mock" \
            TESTFLIGHT_URL="https://testflight.apple.com/join/mocktoken" \
            SETUP_ANDROID_URL="https://mock.example.com/setup-android" \
            SETUP_IOS_URL="https://mock.example.com/setup-ios" \
            bash scripts/notify-telegram.sh

      - run:
          name: Notify Telegram (failure)
          when: on_fail
          command: |
            CHAT_ID_VAR_NAME="<< parameters.telegram_chat_id_var >>"
            BUILD_STATUS=failed \
            PLATFORM=Android \
            TELEGRAM_CHAT_ID="${!CHAT_ID_VAR_NAME}" \
            bash scripts/notify-telegram.sh

workflows:
  dev:
    jobs:
      - build_test:
          telegram_chat_id_var: "TELEGRAM_CHAT_ID_DEV"
          firebase_url: "https://appdistribution.firebase.google.com/mock"
          firebase_setup_android_url: "https://mock.example.com/setup-android"
          firebase_setup_ios_url: "https://mock.example.com/setup-ios"
          filters:
            branches:
              only: /.*/
            tags:
              ignore: /.*/

  release:
    jobs:
      - build_test:
          telegram_chat_id_var: "TELEGRAM_CHAT_ID_RELEASE"
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^(rel|stg|sand)-v\d+\.\d+\.\d+-\d{6}$/