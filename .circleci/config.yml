version: 2.1

# Force unique pipeline per tag by declaring tag as pipeline parameter
parameters:
  GIT_TAG:
    type: string
    default: ""

jobs:
  build_test:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:10.0

    steps:
      - checkout

      - run:
          name: Install tools (jq, shellcheck)
          command: apt-get update -qq && apt-get install -y -qq jq shellcheck

      - run:
          name: Lint shell scripts
          command: shellcheck scripts/notify-telegram.sh

      - run:
          name: Generate NuGet cache key
          command: |
            find . -name "*.csproj" -not -path "*/obj/*" -not -path "*/bin/*" \
              | sort | xargs cat > /tmp/nuget-cache-key.txt

      - restore_cache:
          keys:
            - nuget-{{ checksum "/tmp/nuget-cache-key.txt" }}
            - nuget-

      - run:
          name: Restore dependencies
          command: dotnet restore

      - run:
          name: Build
          command: dotnet build --no-restore --configuration Release -p:MockObfuscate=true 2>&1 | tee build.log

      - run:
          name: Run tests
          command: dotnet test --no-build --configuration Release --logger "junit;LogFilePath=test-results/results.xml"

      - save_cache:
          paths:
            - ~/.nuget/packages
          key: nuget-{{ checksum "/tmp/nuget-cache-key.txt" }}

      - store_test_results:
          path: test-results

      - run:
          name: Notify Telegram (success)
          when: on_success
          command: |
            BUILD_STATUS=success \
            FIREBASE_URL="https://appdistribution.firebase.google.com/mock" \
            FIREBASE_SETUP_URLS="iOS=https://mock.example.com/setup-ios|Android=https://mock.example.com/setup-android|Web=https://mock.example.com/setup-web" \
            PLAY_STORE_URL="https://play.google.com/store/apps/details?id=com.example.mock" \
            TESTFLIGHT_URL="https://testflight.apple.com/join/mocktoken" \
            SETUP_URL="https://mock.example.com/setup" \
            bash scripts/notify-telegram.sh

      - run:
          name: Notify Telegram (failure)
          when: on_fail
          command: BUILD_STATUS=failed bash scripts/notify-telegram.sh

workflows:
  # Workflow สำหรับ branch push ปกติ
  on_branch:
    jobs:
      - build_test:
          filters:
            branches:
              only: /.*/
            tags:
              ignore: /.*/

  # Workflow สำหรับ tag push เท่านั้น
  on_tag:
    jobs:
      - build_test:
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^[a-zA-Z]+-v\d+\.\d+\.\d+-\d{6}$/